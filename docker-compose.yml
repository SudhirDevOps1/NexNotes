# NexNotes — one-command self-hosting
#   docker compose up -d        → http://localhost:3000
#
# Neon / managed Postgres instead of SQLite:
#   1. set DATABASE_URL + run `node scripts/db-switch.mjs postgres "$DATABASE_URL"` before building
#   2. or mount a prebuilt image — see docs/SELF-HOSTING.md

services:
  nexnotes:
    build: .
    container_name: nexnotes
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - AUTH_SECRET=${AUTH_SECRET:-please-change-this-secret}
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      - nexnotes_data:/app/db
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nexnotes_data:
