# NexNotes — one-command self-hosting
#   docker compose up -d        → http://localhost:3000
#
# Neon / managed Postgres instead of SQLite (two options):
#   1. build the image for it, then run with a matching URL:
#        docker compose build --build-arg DB_SCHEMA=postgres
#      and uncomment DATABASE_URL below (the client is provider-bound —
#      build-time and run-time URLs must match, see docs/DEPLOYMENT.md)
#   2. or mount a prebuilt image — see docs/DEPLOYMENT.md

services:
  nexnotes:
    build: .
    container_name: nexnotes
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - AUTH_SECRET=${AUTH_SECRET:-please-change-this-secret}
      - DATABASE_URL=file:/app/db/custom.db
      # Postgres instead (image must be built with the same URL — see header):
      # - DATABASE_URL=postgresql://user:pass@host/db?sslmode=require
    volumes:
      - nexnotes_data:/app/db
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nexnotes_data:
