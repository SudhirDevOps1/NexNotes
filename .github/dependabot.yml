# Dependabot — keeps the toolchain current so security patches are routine.
#
# No "npm" ecosystem on purpose: Dependabot cannot write bun.lock, so every
# weekly npm run just ends in a failed update job (verified on the first
# schedule — two red "npm_and_yarn in /." runs, zero PRs). Runtime dependency
# bumps stay a manual `bun update <pkg>` + commit for now; revisit if
# Dependabot ships bun support.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
