name: Release

# Automated release train — direct, no release PR:
#
#   push to main            → quality gate → cut-release reads the Conventional
#                             Commits since the last v* tag; on feat/fix/perf/
#                             security/revert it bumps the version, prepends
#                             the CHANGELOG section, commits
#                             "chore(main): release nexnotes x.y.z" to main,
#                             tags v* and opens the GitHub Release
#   tag cut by that job     → the artifact jobs below build from THAT tag
#                             (same run — no re-trigger needed)
#   manual v* tag push      → same artifact pipeline against the tag (fallback)
#
# Why not release-please? Its PR flow needs the repository setting
# "Allow GitHub Actions to create and approve pull requests" (off by default
# for new repos); without it every push went red with "not permitted to
# create or approve pull requests". Cutting the release straight on main
# needs only `contents: write`, which this workflow already grants.
#
# Desktop artifacts are real Electron apps (desktop/):
#   windows → one-click per-user NSIS installer, boot-tested silently
#   linux   → AppImage, boot-tested under Xvfb
# plus the portable server packages (tar.gz / zip) for self-hosters.
#
# CHANGELOG.md is generated from commit messages — never edit it by hand.
# The app version lives only in package.json (read at build time by
# src/lib/version.ts), so health endpoint, UI and artifacts cannot drift.
#
# Loop safety: the version-bump commit is pushed with GITHUB_TOKEN, and
# events created by GITHUB_TOKEN never start new workflow runs — the train
# cannot chase its own tail. A manual dispatch right after a release (or a
# push with only docs/chore/ci commits) exits green with nothing released.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality gate (lint · typecheck · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
      AUTH_SECRET: release-build-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare SQLite database
        run: |
          mkdir -p db
          bunx prisma db push --skip-generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Build standalone bundle
        run: |
          bunx next build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

  cut-release:
    name: Cut release (version · changelog · tag)
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.cut.outputs.releases_created }}
      tag_name: ${{ steps.cut.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags: the cutter diffs Conventional Commits
          # against the last v* tag
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cut the release (bump · changelog · tag · push)
        id: cut
        run: node scripts/cut-release.mjs

      - name: Open the GitHub Release
        if: steps.cut.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.cut.outputs.tag_name }}" \
            --title "NexNotes ${{ steps.cut.outputs.tag_name }}" \
            --notes-file "${{ steps.cut.outputs.notes_file }}" \
            --latest

  build-linux:
    name: Linux — portable server + Electron AppImage
    # the release job is skipped on tag builds, so the needs gate must be
    # evaluated explicitly — a plain `needs` would silently skip tag builds
    needs: [quality-gate, cut-release]
    if: ${{ !cancelled() && needs.quality-gate.result == 'success' && (needs.cut-release.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    # ubuntu-22.04 is in deprecation brownouts (support ended 2026-09-17) and
    # silently refuses to schedule jobs — build on the current LTS instead.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
      AUTH_SECRET: release-build-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          # release path: the exact tag cut-release just created;
          # manual path: the pushed v* tag. Builds never run off main.
          ref: ${{ needs.cut-release.outputs.tag_name || github.ref }}

      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build standalone bundle
        run: |
          bunx next build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

      - name: Fetch the Windows Node runtime that ships inside the portable zip
        run: |
          NODE_VER=22.14.0
          curl -fsSL -o /tmp/node-win.zip "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-win-x64.zip"
          unzip -o -q /tmp/node-win.zip -d /tmp/node-win "*/node.exe"
          echo "NODE_WIN=$(find /tmp/node-win -name node.exe | head -1)" >> "$GITHUB_ENV"

      - name: Package portable server (linux tarball + windows zip)
        run: node scripts/package-release.mjs --standalone .next/standalone --out dist --node-win "$NODE_WIN"

      - name: Boot-test packaged tarball
        run: |
          rm -rf /tmp/pkgtest && mkdir -p /tmp/pkgtest
          tar -xzf dist/nexnotes-*-linux-x64.tar.gz -C /tmp/pkgtest
          cd /tmp/pkgtest/nexnotes-*
          PORT=4599 ./run.sh &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4599/api/health | grep -q '"ok":true' && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4599/api/health | grep -q '"ok":true' \
            || { echo "::error::packaged tarball failed to boot"; exit 1; }
          pkill -f "node server.js" || true
          echo "tarball boot: ok"

      - name: Stage the server bundle for the Electron shell
        run: node scripts/stage-desktop.mjs --os linux

      - name: Build the Electron AppImage
        run: |
          cd desktop
          bun install --frozen-lockfile
          node node_modules/electron-builder/cli.js --linux --publish never
          ls -la dist/*.AppImage

      - name: Boot-test the AppImage (Xvfb, FUSE-less)
        run: |
          command -v Xvfb >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          APPIMAGE=$(ls desktop/dist/NexNotes-*-linux-x64.AppImage)
          cp "$APPIMAGE" dist/
          chmod +x dist/$(basename "$APPIMAGE")
          rm -rf ~/.config/NexNotes
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          # --no-sandbox is a CI-runner-only flag: the runner user cannot use
          # the chrome setuid sandbox inside a FUSE-less extraction. End-user
          # machines are unaffected.
          APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:99 \
            dist/$(basename "$APPIMAGE") --no-sandbox >/tmp/appimage-boot.log 2>&1 &
          HANDSHAKE="$HOME/.config/NexNotes/server.json"
          ok=""
          for i in $(seq 1 60); do
            if [ -f "$HANDSHAKE" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::AppImage never wrote the handshake file"
            grep -viE "dbus|Bus|object_proxy" /tmp/appimage-boot.log | tail -30
            exit 1
          fi
          PORT=$(node -p "require('$HANDSHAKE').port")
          for i in $(seq 1 15); do
            curl -sf "http://127.0.0.1:$PORT/api/health" | grep -q '"ok":true' && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:$PORT/api/health" | grep -q '"ok":true' \
            || { echo "::error::AppImage server failed the health check"; exit 1; }
          curl -s "http://127.0.0.1:$PORT/" | grep -q "<title>NexNotes" \
            || { echo "::error::AppImage UI did not render the app shell"; exit 1; }
          echo "AppImage boot: ok (port $PORT)"
          pkill -f appimage_extracted || true
          pkill Xvfb || true

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*
          retention-days: 5

  build-windows:
    name: Windows — Electron installer (NSIS)
    needs: [quality-gate, cut-release]
    if: ${{ !cancelled() && needs.quality-gate.result == 'success' && (needs.cut-release.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
      AUTH_SECRET: release-build-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut-release.outputs.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build standalone bundle
        shell: pwsh
        run: |
          bunx next build
          Copy-Item -Recurse -Force .next/static .next/standalone/.next/static
          Copy-Item -Recurse -Force public .next/standalone/public

      - name: Stage the server bundle for the Electron shell
        run: node scripts/stage-desktop.mjs --os win

      - name: Build the Electron installer (NSIS)
        run: |
          cd desktop
          bun install --frozen-lockfile
          node node_modules/electron-builder/cli.js --win --publish never
          Get-ChildItem dist/*.exe | ForEach-Object { Write-Host "built: $($_.Name)" }

      - name: Smoke — silent install, boot, health check
        shell: pwsh
        run: |
          $exe = (Get-ChildItem desktop/dist/NexNotes-*-windows-x64-setup.exe | Select-Object -First 1).FullName
          Write-Host "installer: $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }

          # the install folder is electron-builder's sanitized package name
          # (nexnotes-desktop), not the display name — resolve the real
          # location from the per-user uninstall entry, glob as a fallback
          $app = $null
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "NexNotes" } | Select-Object -First 1
          if ($entry -and $entry.InstallLocation) { $app = Join-Path $entry.InstallLocation "NexNotes.exe" }
          if (-not ($app -and (Test-Path $app))) {
            $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter "NexNotes.exe" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $app) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  found: Programs\$($_.Name)" }
            throw "NexNotes.exe not found after silent install — no uninstall entry and nothing under %LOCALAPPDATA%\Programs"
          }
          Write-Host "installed at: $app"

          Start-Process -FilePath $app
          $handshake = "$env:APPDATA\NexNotes\server.json"
          $ok = $false
          foreach ($i in 1..60) {
            if (Test-Path $handshake) { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            $log = "$env:APPDATA\NexNotes\logs\server.log"
            if (Test-Path $log) { "--- server log ---"; Get-Content $log -Tail 40 }
            throw "installed app never wrote the handshake file (120s)"
          }
          $port = (Get-Content $handshake | ConvertFrom-Json).port
          $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 10
          if (-not $r.ok) { throw "health endpoint returned ok=$($r.ok)" }
          if (-not (Test-Path "$env:APPDATA\NexNotes\nexnotes.db")) { throw "user-data db was not seeded" }
          Write-Host "installed app boot: ok (version $($r.version), port $port, data in %APPDATA%\NexNotes)"
          taskkill /IM NexNotes.exe /T /F 2>$null | Out-Null

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: desktop/dist/*.exe
          retention-days: 5

  publish:
    name: Attach artifacts to the GitHub Release
    needs: [cut-release, build-linux, build-windows]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && (needs.cut-release.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # make-sums.mjs lives in the repo and the first v2.2.0 tag build proved
      # the publish job dies on its first line without it — a shallow checkout
      # is cheaper than inlining the checksum format into the workflow
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist

      - name: Checksums + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh reads the repo from the checkout, but being explicit costs
          # nothing and keeps the step honest if the checkout ever goes away
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.cut-release.outputs.tag_name || github.ref_name }}
        run: |
          node scripts/make-sums.mjs dist "nexnotes-${TAG}-SHA256SUMS.txt"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --generate-notes --title "NexNotes $TAG"
          gh release upload "$TAG" dist/* --clobber
          echo "attached to $TAG:"
          ls -la dist/
