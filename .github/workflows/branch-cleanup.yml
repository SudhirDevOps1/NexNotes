name: Branch Cleanup

# Deletes the head branch automatically once a PR is merged. Keeps the
# branch list human-sized; skipped for protected/long-lived branches.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'develop'

    steps:
      - name: Delete the merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch "${branch}".`);
            } catch (err) {
              if (err.status === 422) {
                console.log(`Branch "${branch}" is protected or already gone — skipping.`);
              } else {
                throw err;
              }
            }
