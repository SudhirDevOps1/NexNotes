name: Scorecard

# OpenSSF Supply-chain Scorecard — audits this repo against the supply-chain
# security best practices (pinned deps, SAST, branch protection, signed
# releases…). Results are published to the OpenSSF API and, via SARIF, to the
# Code scanning dashboard. Public scorecard: https://deps.dev — search NexNotes.

on:
  branch_protection_rule:
  schedule:
    - cron: "53 5 * * 6" # Saturdays
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # SARIF upload
      id-token: write # OIDC token for result publishing
      contents: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
