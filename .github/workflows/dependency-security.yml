name: Dependency Security

# NPM dependency vulnerability scan (bun audit over bun.lock).
#
# Status: ADVISORY. The tree currently carries known advisories from
# transitive packages (mostly the editor/Markdown stack). Failing every PR
# on those would train everyone to ignore the workflow, so this job reports
# loudly instead of blocking. Flip `continue-on-error` to `false` once the
# planned dependency sweep lands — the gate is ready and waiting.

on:
  push:
    branches: [main]
    paths: ["package.json", "bun.lock"]
  pull_request:
    paths: ["package.json", "bun.lock"]
  schedule:
    - cron: "31 3 * * *" # daily — new advisories don't wait for PRs
  workflow_dispatch:

concurrency:
  group: depsec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: bun audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        id: audit
        continue-on-error: true # advisory until the dependency sweep lands
        run: |
          bun audit --json > audit.json || true
          bun audit --audit-level high || true
          CRITICAL=$(python3 -c "
          import json,sys
          try:
              data=json.load(open('audit.json'))
              advisories=data.get('advisories') or []
              print(sum(1 for a in advisories if str(a.get('severity','')).lower()=='critical'))
          except Exception:
              print(0)
          ")
          echo "critical_count=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "### Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Critical advisories: **$CRITICAL** (report attached as artifact)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::warning::bun audit reports $CRITICAL critical advisories — see audit.json artifact"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: audit.json
          retention-days: 14
