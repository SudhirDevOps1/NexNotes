name: Coverage

# Test coverage reports, uploaded to Codecov (tokenless for public repos).
# Deliberately separate from CI so the quality gate stays fast — this runs
# the same suite once more under the V8 coverage instrument.
#
# Coverage is information, not a gate: it must never fail a green build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Vitest coverage → Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
      AUTH_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false # advisory — never block on the uploader
          token: ${{ secrets.CODECOV_TOKEN }} # optional; tokenless works on public repos

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not produced (text table is in the test step above)." >> "$GITHUB_STEP_SUMMARY"
          fi
