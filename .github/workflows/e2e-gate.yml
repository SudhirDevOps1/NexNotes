name: E2E Gate

# Real-browser gate. Boots the production standalone bundle against a fresh
# SQLite database and drives it with Playwright/Chromium: login screen,
# demo login journey and the register/health API surface.
#
# Runs on the same paths CI does. Keep this suite small and boring — it is a
# gate, not a playground; deep interaction coverage belongs in unit tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:${{ github.workspace }}/db/e2e.db"
      AUTH_SECRET: ci-e2e-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client + fresh E2E database
        run: |
          bunx prisma generate
          mkdir -p db
          bunx prisma db push --skip-generate

      - name: Build standalone bundle
        run: |
          bunx next build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
        env:
          AUTH_SECRET: ci-e2e-secret-not-for-production

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
